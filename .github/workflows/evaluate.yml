name: RAGAS Evaluation

# NOTE: disabled via GitHub (Settings > Actions > Workflows) pending #49 --
# results aren't thresholded/acted on yet, so runs just burn OpenAI quota.
# Re-enable the workflow on GitHub once #49 ships.

on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pipeline:
              - 'pipeline/**'
              - 'retrieval/**'
              - 'ingestion/**'
              - 'evaluation/**'
              - 'config.py'
              - 'requirements.txt'

  evaluate:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run RAGAS evaluation
        run: python evaluation/evaluate.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION: contract
          QUERY_REWRITE_STRATEGY: hyde

      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/results.json
