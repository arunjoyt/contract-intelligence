# Local development override — exposes service ports directly to the host.
#
# Usage (run everything in Docker locally):
#   docker compose -f docker-compose.yml -f docker-compose.frontend.yml up -d
#
# For the usual local dev workflow (infra in Docker, app/frontend natively), this
# file is not needed — see the Quick Start section in README.md instead.

services:
  app:
    ports:
      - "8000:8000"
    environment:
      # host.docker.internal resolves to the Mac host — lets the container reach
      # a locally running ERPNext instance (127.0.0.1 is loopback-only inside Docker).
      ERPNEXT_URL: http://host.docker.internal:8005

  frontend:
    ports:
      - "8501:8501"

  qdrant:
    ports:
      # 6333 is already published (loopback-only) by docker-compose.yml; adding it
      # again here would create a conflicting duplicate bind on the same host port
      # and Docker silently drops both. Only publish the extra gRPC port here.
      - "6334:6334"

  langfuse:
    ports:
      - "127.0.0.1:3000:3000"

  postgres:
    ports:
      - "127.0.0.1:5432:5432"
