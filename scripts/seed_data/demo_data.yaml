terms_and_conditions:
  - title: "Standard Purchase Terms - Net 30"
    terms_html: |
      <p>Payment is due within 30 days of invoice date. Late payments accrue interest at 1.5%
      per month. Goods remain the property of the supplier until payment is received in full.</p>

  - title: "Security Services - Confidentiality Clause"
    terms_html: |
      <p>All personnel deployed under this agreement shall be bound by confidentiality
      obligations covering premises layouts, access codes, and incident reports for the
      duration of the engagement and two years thereafter.</p>

  - title: "Warehousing & Logistics - Liability Terms"
    terms_html: |
      <p>The warehousing provider's liability for loss or damage to stored goods is capped at
      the declared value of the goods or $50,000 per incident, whichever is lower. Claims must
      be filed within 15 days of discovery.</p>

  - title: "SaaS / Software License Terms"
    terms_html: |
      <p>The license is non-exclusive and non-transferable for the subscription term. The
      vendor commits to 99.9% monthly uptime; service credits apply for any shortfall,
      calculated on a sliding scale against the monthly subscription fee.</p>

  - title: "Consulting / Professional Services Terms"
    terms_html: |
      <p>Deliverables are billed against agreed milestones. Either party may terminate for
      convenience with 30 days' written notice; fees for work completed up to the termination
      date remain payable.</p>

  - title: "Marketing Services Terms"
    terms_html: |
      <p>Campaign creative and media placements require written approval before publication.
      All media spend is billed at cost plus an agreed agency fee, itemized monthly.</p>

  - title: "IT Hardware Warranty Terms"
    terms_html: |
      <p>All hardware is covered by a 3-year manufacturer warranty passed through to the buyer.
      Defective units are replaced within 5 business days of a validated support ticket.</p>

  - title: "Facilities Maintenance SLA Terms"
    terms_html: |
      <p>Routine maintenance requests are actioned within 2 business days; emergency callouts
      (life-safety systems, flooding, power loss) are actioned within 4 hours, 24/7.</p>

  - title: "Legacy Payment Terms - Net 60"
    disabled: true
    terms_html: |
      <p>Deprecated. Payment was due within 60 days of invoice date. Superseded by Standard
      Purchase Terms - Net 30 for all agreements executed after 2024.</p>

