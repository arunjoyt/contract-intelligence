    status: "Unsigned"
    docstatus: 1
    is_signed: false
    start_date: "2026-01-01"
    end_date: "2026-12-31"
    contract_terms_html: |
      <p>This Master Services Agreement covers on-site security services provided by Zuckerman
      Security Ltd. at the buyer's primary facility, including guard staffing, access control
      monitoring, and incident response.</p>
      <p><strong>Service Level Agreement.</strong> Zuckerman shall maintain a maximum of two
      (2) service level incidents per calendar quarter. Should this threshold be exceeded, a
      penalty equal to 5% of the quarterly invoice amount shall apply for each additional
      incident.</p>
      <p><strong>Termination for Cause.</strong> Either party may terminate this agreement for
      cause with a 15-day cure period following written notice of breach.</p>
    pdf_attachment:
      title: "Zuckerman Security Ltd. — Master Services Agreement"
      clauses:
        - heading: "Liability Cap"
          body: >
            The total aggregate liability of either party arising under this agreement shall
            not exceed an amount equal to twelve (12) months' fees paid under this contract.
        - heading: "Termination for Cause"
          body: >
            Either party may terminate this agreement for cause upon written notice, subject
            to a fifteen (15) day cure period during which the breaching party may remedy the
            default.

