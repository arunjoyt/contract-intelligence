networks:
  rag_internal:
    driver: bridge
    # No public ports — nginx is the sole ingress. All inter-service traffic
    # stays on this network; only nginx binds host ports 80/443.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [rag_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      TELEMETRY_ENABLED: "false"
      # Seed a project on first boot so LANGFUSE_PUBLIC_KEY / SECRET_KEY work immediately.
      # These must match the keys set in .env.
      LANGFUSE_INIT_ORG_ID: procurement-org
      LANGFUSE_INIT_ORG_NAME: Procurement
      LANGFUSE_INIT_PROJECT_ID: procurement-project
      LANGFUSE_INIT_PROJECT_NAME: procurement-rag
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: admin@localhost.local
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    networks: [rag_internal]

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [rag_internal]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - qdrant
      - langfuse
    env_file: .env
    environment:
      # Override localhost URLs with container service names.
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: http://langfuse:3000
    networks: [rag_internal]

  frontend:
    build: .
    restart: unless-stopped
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - app
    env_file: .env
    environment:
      BACKEND_URL: http://app:8000
    networks: [rag_internal]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - frontend
    networks: [rag_internal]

volumes:
  pg_data:
  qdrant_data:
