[project]
name = "procurement-rag"
version = "0.1.0"
description = "RAG system answering natural-language procurement questions grounded in ERPNext data"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# Local-only #113 tuning-sweep scripts / run archives — not shipped code (also
# gitignored on the phase-113 branch). Kept out of lint so throwaway sweep
# helpers don't have to meet the repo's style bar.
extend-exclude = ["evaluation/tuning"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["config", "ingestion", "retrieval", "pipeline", "api", "evaluation"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests that require live external services (ERPNext, Qdrant, OpenAI)",
    "ingestion: marks ingestion-layer integration tests",
    "retrieval: marks retrieval-layer integration tests",
    "pipeline: marks pipeline-layer integration tests (OpenAI + Qdrant, no ERPNext required for some)",
    "api: marks API-layer integration tests (requires uvicorn app via TestClient + all services)",
    "evaluation: marks evaluation-layer integration tests (runs evaluate.py against live services)",
    "docker: marks Docker Compose full-stack integration tests (requires docker compose up)",
    "langfuse: marks Langfuse observability integration tests (requires live Langfuse server)",
    "auth: marks auth integration tests (requires docker compose up; JWT_SECRET in .env)",
    "webhook: marks webhook→Qdrant flow integration tests (ERPNext + Qdrant + OpenAI; no Docker stack needed)",
]
