# Nginx configuration — Option B production topology
#
# Domain-specific server blocks live in nginx/templates/procurement-rag.conf.template,
# substituted from FRONTEND_DOMAIN / API_DOMAIN (set in .env) into
# /etc/nginx/conf.d/ every time the container starts — see that file for details.
# This file only holds the static, domain-independent top-level config.
#
# TLS setup (run once on the host before starting Docker Compose):
#   certbot certonly --standalone \
#     -d "$FRONTEND_DOMAIN" \
#     -d "$API_DOMAIN"
#
# IMPORTANT: passing both -d flags to a single certbot invocation issues ONE
# certificate covering both domains (via SAN), stored under a single lineage
# directory named after the FIRST -d domain — certbot does not create a
# second /etc/letsencrypt/live/<api-domain>/ directory. The template
# intentionally points both server blocks at the FRONTEND_DOMAIN cert
# directory for this reason.
#
# Certs land in /etc/letsencrypt/live/<domain>/ and are mounted read-only
# into the nginx container via docker-compose.yml.
#
# Auto-renewal (add to host crontab):
#   0 3 * * * certbot renew --quiet && docker compose exec nginx nginx -s reload

events {
    worker_connections 1024;
}

http {
    # Use Docker Compose's embedded DNS so upstream names (frontend, app) resolve
    # at request time, not at startup — avoids "host not found" when a container
    # is still starting up.
    resolver 127.0.0.11 valid=10s;

    include /etc/nginx/conf.d/*.conf;
}
