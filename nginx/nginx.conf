# Nginx configuration — Option B production topology
#
# Replace all occurrences of example.com with your actual domain before deploying.
#
# TLS setup (run once on the host before starting Docker Compose):
#   certbot certonly --standalone \
#     -d procurement-rag.example.com \
#     -d api.procurement-rag.example.com
#
# Certs land in /etc/letsencrypt/live/<domain>/ and are mounted read-only
# into the nginx container via docker-compose.yml.
#
# Auto-renewal (add to host crontab):
#   0 3 * * * certbot renew --quiet && docker compose exec nginx nginx -s reload

events {
    worker_connections 1024;
}

http {
    # Use Docker Compose's embedded DNS so upstream names (frontend, app) resolve
    # at request time, not at startup — avoids "host not found" when a container
    # is still starting up.
    resolver 127.0.0.11 valid=10s;

    # Redirect all HTTP traffic to HTTPS
    server {
        listen 80;
        server_name procurement-rag.example.com api.procurement-rag.example.com;
        return 301 https://$host$request_uri;
    }

    # Streamlit frontend — requires WebSocket upgrade for live updates
    server {
        listen 443 ssl;
        server_name procurement-rag.example.com;

        ssl_certificate     /etc/letsencrypt/live/procurement-rag.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/procurement-rag.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        location / {
            set $upstream_frontend http://frontend:8501;
            proxy_pass $upstream_frontend;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WebSocket headers required by Streamlit
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # FastAPI backend — longer timeout for LLM calls (20-30s typical)
    server {
        listen 443 ssl;
        server_name api.procurement-rag.example.com;

        ssl_certificate     /etc/letsencrypt/live/api.procurement-rag.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.procurement-rag.example.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        location / {
            set $upstream_app http://app:8000;
            proxy_pass $upstream_app;
            proxy_read_timeout 120s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
